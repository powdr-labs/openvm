version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
openvm-stark-sdk.workspace = true
openvm-circuit = { workspace = true, features = ["test-utils"] }
openvm-instructions.workspace = true
openvm-transpiler.workspace = true
openvm-rv32im-circuit.workspace = true
openvm-rv32im-transpiler.workspace = true
openvm-rv32im-extra-alu-circuit = { workspace = true, features = ["test-utils"] }
openvm-rv32im-extra-alu-transpiler.workspace = true
openvm-toolchain-tests = { path = "../../../crates/toolchain/tests" }
openvm-build.workspace = true
sdk-v2.workspace = true
eyre.workspace = true

[features]
default = ["parallel"]
parallel = ["openvm-circuit/parallel"]
cuda = ["openvm-rv32im-extra-alu-circuit/cuda"]
