[workspace]
[package]
name = "openvm-rv32im-extra-alu-test-programs"
version = "0.0.0"
edition = "2021"

[dependencies]
openvm = { path = "../../../../crates/toolchain/openvm", default-features = false }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
hex-literal = "1.1"

[features]
default = []
std = ["openvm/std"]

[profile.release]
panic = "abort"
lto = "thin"
